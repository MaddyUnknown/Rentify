<h2>Property Form</h2>
<form (ngSubmit)="saveProperty()">
  <label for="name">Name</label>
  <input id="name" [(ngModel)]="property.name" name="name">
  <br>
  <label for="address">Address</label>
  <input id="address" [(ngModel)]="property.address" name="address">
  <br>
  <label for="description">Description</label>
  <input id="description" [(ngModel)]="property.description" name="description">
  <br>
  <button type="submit">Save</button>
</form>
