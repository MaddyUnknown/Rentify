<app-panel [icon]="ICONS.InfoIcon" title="Property Details">
  <div appPanelButtons class="app-property-details__btns">
    <button
      appButton
      [input]="panelMode.isEdit ? { icon: ICONS.Save, label: 'Save' } : { icon: ICONS.SquarePen, label: 'Edit' }"
      (click)="panelMode.toggle()"
    ></button>
    <button
      appButton
      color="danger"
      [input]="panelMode.isEdit ? { icon: ICONS.CircleX, label: 'Close' } : { icon: ICONS.Trash2, label: 'Delete' }"
    ></button>
  </div>
  <form appPanelDesc appForm [isReadOnly]="panelMode.isView">
    <div formGroup>
      <label for="name">Property Name</label>
      <input type="text" name="name" id="name" [(ngModel)]="details.name" />
    </div>
    <div formGroup>
      <label for="street-name">Address </label>
      <input type="text" name="street-name" id="street-name" [(ngModel)]="details.streetName" />
    </div>
    <div formRow>
      <div formGroup>
        <label for="city">City</label>
        <input type="text" name="city" id="city" [(ngModel)]="details.city" />
      </div>
      <div formGroup>
        <label for="state">State</label>
        <input type="text" name="state" id="state" [(ngModel)]="details.state" />
      </div>
      <div formGroup>
        <label for="zip-code">Zip Code</label>
        <input type="text" name="zip-code" id="zip-code" [(ngModel)]="details.zipCode" />
      </div>
    </div>
    <div formGroup>
      <label for="description">Description</label>
      <textarea name="description" id="description" rows="4" [(ngModel)]="details.description"></textarea>
    </div>
  </form>
</app-panel>
