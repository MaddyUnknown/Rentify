<thead>
  <tr>
    @for (column of columns; track column.displayName) {
      <th [style.text-align]="column.columnAlignment">{{ column.displayName }}</th>
    }
  </tr>
</thead>
<tbody>
  @for (row of data; track $index) {
    <tr>
      @for (column of columns; track column.displayName) {
        <td>
          <ng-container *ngTemplateOutlet="column.template; context: { $implicit: row }"></ng-container>
        </td>
      }
    </tr>
  }
</tbody>
