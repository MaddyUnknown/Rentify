@if (currentInput?.icon != undefined) {
  <lucide-icon
    [img]="currentInput?.icon"
    [class]="
      iconClass !== undefined
        ? iconClass
        : type === 'inline'
          ? 'app-button__icon--inline'
          : type === 'normal'
            ? 'app-button__icon'
            : ''
    "
  ></lucide-icon>
}
@if (currentInput?.label != undefined) {
  <span>{{ currentInput?.label }}</span>
}
