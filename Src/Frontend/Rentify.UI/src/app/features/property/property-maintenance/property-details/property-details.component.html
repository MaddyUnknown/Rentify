<app-panel [icon]="ICONS.InfoIcon" heading="Property Details">
  <div appPanelButtons>
    <button
      appButton
      type="normal"
      color="primary"
      [input]="mode.isEdit ? { icon: ICONS.Save, label: 'Save' } : { icon: ICONS.SquarePen, label: 'Edit' }"
      [disabled]="loading || disableActions"
      (click)="onAddEditClick()"
    ></button>
    <button
      appButton
      type="normal"
      color="danger"
      [input]="mode.isEdit ? { icon: ICONS.CircleX, label: 'Close' } : { icon: ICONS.Trash2, label: 'Delete' }"
      [disabled]="loading || disableActions"
      (click)="onRemoveCloseClick()"
    ></button>
  </div>

  @if (loading) {
    <div appPanelDesc class="app-form">
      <div class="form-group">
        <label>Property Name</label>
        <app-skeleton-loader type="input" />
      </div>
      <div class="form-group">
        <label>Address</label>
        <app-skeleton-loader type="input" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>City</label>
          <app-skeleton-loader type="input" />
        </div>
        <div class="form-group">
          <label>State</label>
          <app-skeleton-loader type="input" />
        </div>
        <div class="form-group">
          <label>Zip Code</label>
          <app-skeleton-loader type="input" />
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <app-skeleton-loader type="box" class="app-property-details__shadow-text-box" />
      </div>
    </div>
  } @else {
    <form appPanelDesc class="app-form" [formGroup]="form">
      <div class="form-group">
        <label for="property-name">Property Name</label>
        <input
          id="property-name"
          type="text"
          formControlName="name"
          [attr.invalid]="isInvalid(form.controls.name) ? '' : null"
        />
      </div>
      <div class="form-group">
        <label for="property-street-name">Address</label>
        <input
          id="property-street-name"
          type="text"
          formControlName="streetName"
          [attr.invalid]="isInvalid(form.controls.streetName) ? '' : null"
        />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="property-city">City</label>
          <input
            id="property-city"
            type="text"
            formControlName="city"
            [attr.invalid]="isInvalid(form.controls.city) ? '' : null"
          />
        </div>
        <div class="form-group">
          <label for="property-state">State</label>
          <input
            id="property-state"
            type="text"
            formControlName="state"
            [attr.invalid]="isInvalid(form.controls.state) ? '' : null"
          />
        </div>
        <div class="form-group">
          <label for="property-zip-code">Zip Code</label>
          <input
            id="property-zip-code"
            type="text"
            formControlName="zipCode"
            [attr.invalid]="isInvalid(form.controls.zipCode) ? '' : null"
          />
        </div>
      </div>
      <div class="form-group">
        <label for="property-description">Description</label>
        <textarea
          id="property-description"
          rows="4"
          formControlName="description"
          [attr.invalid]="isInvalid(form.controls.description) ? '' : null"
        ></textarea>
      </div>
    </form>
  }
</app-panel>
