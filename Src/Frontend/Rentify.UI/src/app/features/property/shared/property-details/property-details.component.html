<app-panel [icon]="ICONS.InfoIcon" title="Property Details">
  <div appPanelButtons class="app-property-details__btns">
    <button
      appButton
      [input]="panelMode.isEdit ? { icon: ICONS.Save, label: 'Save' } : { icon: ICONS.SquarePen, label: 'Edit' }"
      (click)="panelMode.state = panelMode.isEdit ? 'view' : 'edit'"
    ></button>
    <button
      appButton
      color="danger"
      [input]="panelMode.isEdit ? { icon: ICONS.CircleX, label: 'Close' } : { icon: ICONS.Trash2, label: 'Delete' }"
    ></button>
  </div>
  <form appPanelDesc appForm [isReadOnly]="panelMode.isView">
    <div formGroup>
      <label for="property-name">Property Name</label>
      <input type="text" name="name" id="property-name" [(ngModel)]="details.name" />
    </div>
    <div formGroup>
      <label for="property-street-name">Address </label>
      <input type="text" name="street-name" id="property-street-name" [(ngModel)]="details.streetName" />
    </div>
    <div formRow>
      <div formGroup>
        <label for="property-city">City</label>
        <input type="text" name="city" id="property-city" [(ngModel)]="details.city" />
      </div>
      <div formGroup>
        <label for="property-state">State</label>
        <input type="text" name="state" id="property-state" [(ngModel)]="details.state" />
      </div>
      <div formGroup>
        <label for="property-zip-code">Zip Code</label>
        <input type="text" name="zip-code" id="property-zip-code" [(ngModel)]="details.zipCode" />
      </div>
    </div>
    <div formGroup>
      <label for="property-description">Description</label>
      <textarea name="description" id="property-description" rows="4" [(ngModel)]="details.description"></textarea>
    </div>
  </form>
</app-panel>
