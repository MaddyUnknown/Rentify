name: Build and Test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build_test-frontend:

    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Src/Frontend/Rentify.UI
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: ./Src/Frontend/Rentify.UI/package-lock.json
    - name: Restore dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Test
      run: npm test


  build_test-backend:

    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Src/Backend

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build